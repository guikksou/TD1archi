name: github deuxieme workflow
run-name: ${{ github.actor }} run le deuxième workflow pour construire l'image docker et le publier !
on: [push]
jobs:
  build-and-publish-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: build docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/sysinfo-api:0.0.1 .
      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: push docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/sysinfo-api:0.0.1
      - name: docker logout
        run: docker logout
      - name: github conteneur registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push docker image to github conteneur registry
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/sysinfo-api:0.0.1 ghcr.io/${{ github.repository_owner }}/sysinfo-api:0.0.1
          docker push ghcr.io/${{ github.repository_owner }}/sysinfo-api:0.0.1
      