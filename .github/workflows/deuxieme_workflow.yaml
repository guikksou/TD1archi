name: github deuxieme workflow
run-name: ${{ github.actor }} run le deuxième workflow pour construire l'image docker et le publier !
on:
  workflow_run:
    workflows: ["GitHub Actions Demo"]
    types:
      - completed
jobs:
  build-and-publish-docker-image:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: build docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/sysinfo-api:0.0.1 .
      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: push docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/sysinfo-api:0.0.1
      - name: docker logout
        run: docker logout
      - name: github conteneur registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push docker image to github conteneur registry
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/sysinfo-api:0.0.1 ghcr.io/${{ github.repository_owner }}/sysinfo-api:0.0.1
          docker push ghcr.io/${{ github.repository_owner }}/sysinfo-api:0.0.1
      - name: deploy to Azure Web App
        env:
          AZURE_WEBHOOK_URL: ${{ secrets.AZURE_WEBHOOK_URL }}
        run: curl -fsS -X POST "$AZURE_WEBHOOK_URL"
